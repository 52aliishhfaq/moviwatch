name: Validate Moviwatch

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/voe-only-pakistan-player"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax and regression checks
        run: npm run check
