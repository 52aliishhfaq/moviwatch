name: Deploy Moviwatch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: moviwatch-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_REST_URL: ${{ secrets.REDIS_REST_URL }}
          REDIS_REST_TOKEN: ${{ secrets.REDIS_REST_TOKEN }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_PASSWORD_PEPPER: ${{ secrets.ADMIN_PASSWORD_PEPPER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL REDIS_REST_URL REDIS_REST_TOKEN ADMIN_PASSWORD_HASH ADMIN_PASSWORD_PEPPER JWT_SECRET)
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing repository secret: $key"; exit 1; fi
          done
      - name: Set Cloudflare Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_REST_URL: ${{ secrets.REDIS_REST_URL }}
          REDIS_REST_TOKEN: ${{ secrets.REDIS_REST_TOKEN }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_PASSWORD_PEPPER: ${{ secrets.ADMIN_PASSWORD_PEPPER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          for key in DATABASE_URL REDIS_REST_URL REDIS_REST_TOKEN ADMIN_PASSWORD_HASH ADMIN_PASSWORD_PEPPER JWT_SECRET; do
            printf '%s' "${!key}" | npx wrangler secret put "$key"
          done
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
