<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moviwatch</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f4f6fc;font:16px system-ui}header{padding:20px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #29334b}a{color:#aabaff}.wrap{max-width:1150px;margin:auto;padding:28px 20px}h1{margin:0;font-size:24px}.hero h2{font-size:36px;margin:10px 0}p{color:#9eabc4}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,button{background:#151e31;color:white;border:1px solid #36425d;border-radius:9px;padding:11px 14px;font:inherit}input{flex:1;min-width:200px}button{background:#687cff;border-color:#687cff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}.card{background:#141d2e;border:1px solid #29334b;border-radius:13px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#25314a;display:block}.poster-link{display:block}.watch-link{display:inline-block;background:#687cff;color:#fff;text-decoration:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}.details{padding:12px}.details h3{margin:0 0 5px;font-size:16px}.cat{color:#aabaff;font-size:12px;margin-bottom:10px}.options{display:flex;gap:6px;flex-wrap:wrap}.options button{font-size:12px;padding:7px 9px}.empty{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed #36425d;border-radius:12px}.player{margin:26px 0;padding:16px;border:1px solid #36425d;border-radius:13px}.player[hidden]{display:none}video{width:100%;max-height:70vh;background:#000}
</style></head><body><header><h1>🎬 Moviwatch</h1><a href="/admin">Admin</a></header><main class="wrap"><section class="hero"><h2>Discover your next movie.</h2><p>Browse Action and Romantic titles. No account needed.</p></section><div class="filters"><input id="q" placeholder="Search movies"><select id="cat"><option value="">All categories</option><option>Action</option><option>Romantic</option></select><button id="go">Search</button></div><section id="player" class="player" hidden><h3 id="now"></h3><video id="video" controls playsinline preload="metadata"></video></section><section id="grid" class="grid"><p class="empty">Loading…</p></section></main><script>
const grid=document.querySelector('#grid'),player=document.querySelector('#player'),video=document.querySelector('#video');
const node=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};
async function load(){grid.replaceChildren(node('p','empty','Loading…'));const p=new URLSearchParams();if(q.value.trim())p.set('q',q.value.trim());if(cat.value)p.set('category',cat.value);try{const r=await fetch('/api/movies?'+p),d=await r.json();if(!r.ok)throw Error(d.error);render(d.movies||[])}catch(e){grid.replaceChildren(node('p','empty',e.message||'Unable to load movies'))}}
function render(rows){grid.replaceChildren();if(!rows.length){grid.append(node('p','empty','No movies found'));return}for(const m of rows){const card=node('article','card'),link=node('a','poster-link');link.href='/watch/'+encodeURIComponent(m.id);link.setAttribute('aria-label','Watch '+m.title);const img=node('img','poster');img.src=m.poster_url;img.alt=m.title+' poster';img.loading='lazy';img.referrerPolicy='no-referrer';link.append(img);const info=node('div','details');info.append(node('h3','',m.title),node('div','cat',m.category));const watch=node('a','watch-link','Watch now');watch.href='/watch/'+encodeURIComponent(m.id);info.append(watch);card.append(link,info);grid.append(card)}}
document.querySelector('#go').onclick=load;document.querySelector('#cat').onchange=load;document.querySelector('#q').onkeydown=e=>{if(e.key==='Enter')load()};load();
</script></body></html>
