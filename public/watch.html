<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moviwatch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/moviwatch-app-icon.svg">
<link rel="apple-touch-icon" href="/assets/moviwatch-app-icon-180.png">
<title>Watch · Moviwatch</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#26334a;--muted:#9eabc4;--accent:#7185ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1a2944 0,transparent 55%),var(--bg);color:#f4f6fc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:68px;padding:0 max(5vw,22px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#080d18e8}
.brand{font-weight:750;font-size:19px;color:#fff;text-decoration:none;letter-spacing:-.3px}
header nav a,.back{color:#bdc8ff;text-decoration:none}
header nav a:hover,.back:hover{color:#fff}
main{width:min(1160px,calc(100% - 40px));margin:30px auto 64px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;font-size:14px}
.heading{margin-bottom:16px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0;letter-spacing:-.7px}
.meta{color:var(--muted);margin:8px 0 0;font-size:14px}
.player-shell{overflow:hidden;padding:10px;background:#05080e;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 60px #0005}
.video-stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:9px;overflow:hidden}
video{display:block;width:100%;height:100%;background:#000;object-fit:contain}
.spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#0006}
.spinner::after{content:'';width:46px;height:46px;border:4px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{margin:9px 4px 0;color:var(--muted);font-size:12px}
.status.error{color:#ff9d9d}
.status:empty{display:none}
.retry{margin:8px 4px 2px;padding:8px 16px;border:1px solid #8294ff;border-radius:8px;background:#6578f5;color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.retry:hover{background:#5368e8}
.source-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.source-bar label,.audio-control{font-weight:700;font-size:12px;color:var(--muted)}
select{min-width:150px;max-width:100%;height:38px;padding:0 30px 0 10px;background:#0d1627;color:#f4f6fc;border:1px solid #40506d;border-radius:8px;font:inherit;font-size:13px}
.download-now{display:inline-flex;min-height:40px;align-items:center;justify-content:center;padding:9px 16px;border:1px solid #8294ff;border-radius:9px;background:#6578f5;color:#fff;text-decoration:none;font-weight:700}
.download-now:hover{background:#5368e8}
.audio-control{display:flex;align-items:center;gap:8px}
.episode-context,.episode-navigation,.series-browser{margin:16px 0;padding:16px;background:#111a2b;border:1px solid var(--line);border-radius:12px}
.series-poster{display:block;width:100%;max-height:280px;object-fit:cover;object-position:center 28%;border-radius:9px;margin:0 0 14px}
.series-browser h2{margin:0 0 6px;font-size:20px}
.series-description{margin:0 0 14px;color:var(--muted);font-size:14px}
.episode-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin-top:14px}
.episode-link{display:block;padding:12px;border:1px solid #35425c;border-radius:9px;background:#0d1627;color:#f4f6fc;text-decoration:none}
.episode-link:hover{border-color:#8494ff;background:#17233a}
.episode-link small{display:block;margin-top:3px;color:var(--muted)}
.episode-context{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.episode-context a,.episode-navigation a{color:#bdc8ff;text-decoration:none;font-weight:700}
.episode-navigation{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:650px){header{height:58px;padding:0 14px}main{width:calc(100% - 24px);margin:20px auto 40px}.player-shell{padding:0;border-radius:10px}.source-bar{align-items:stretch;flex-direction:column}.source-bar select,.source-bar .download-now{width:100%}.episode-list{grid-template-columns:1fr}.series-browser,.episode-context,.episode-navigation{padding:12px}}
</style>
</head>
<body>
<header><a class="brand" href="/">🎬 Moviwatch</a><nav><a href="/admin">Admin</a></nav></header>
<main>
<a class="back" href="/">← Back to catalogue</a>
<div class="heading"><h1 id="title">Loading movie…</h1><p class="meta" id="category"></p></div>
<div id="episodeContext" class="episode-context" hidden>
  <a id="seriesBack" href="/">← Back to series</a>
  <strong id="episodeLabel"></strong>
</div>
<section id="playerShell" class="player-shell" aria-label="Native HTML5 video player">
  <div class="video-stage">
    <video id="video" controls playsinline preload="metadata" controlslist="nodownload"></video>
    <div id="spinner" class="spinner" hidden aria-hidden="true"></div>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <button id="retryBtn" class="retry" type="button" hidden>Retry playback</button>
</section>
<div id="sourceBar" class="source-bar" hidden>
  <label id="sourceSelectLabel" for="sourceSelect" hidden>Video source</label>
  <select id="sourceSelect" aria-label="Choose video source" hidden></select>
  <label id="audioControl" class="audio-control" for="audioSelect" hidden>Audio
    <select id="audioSelect" aria-label="Audio language"></select>
  </label>
  <a id="downloadNow" class="download-now" href="#" hidden>Download Now</a>
</div>
<nav id="episodeNavigation" class="episode-navigation" aria-label="Episode navigation" hidden>
  <a id="previousEpisode" href="#" hidden>← Previous episode</a>
  <a id="nextEpisode" href="#" hidden>Next episode →</a>
</nav>
<section id="seriesBrowser" class="series-browser" hidden>
  <img id="seriesPoster" class="series-poster" alt="">
  <h2>Seasons and episodes</h2>
  <p id="seriesDescription" class="series-description"></p>
  <label for="seasonSelect">Choose season</label>
  <select id="seasonSelect"></select>
  <div id="episodeList" class="episode-list"></div>
</section>
</main>
<script>
const $=selector=>document.querySelector(selector);
const movieId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('id')||'');
const video=$('#video');
let availableSources=[],activeOptionIndex=-1,audioTrackList=null;
let pendingResume=null,recoveries=0,lastSaved=0,automaticFallbackUsed=false;
const POSITION_KEY='moviwatch:pos:'+movieId;
function savedPosition(){try{const v=Number(localStorage.getItem(POSITION_KEY));return Number.isFinite(v)&&v>0?v:0}catch{return 0}}
function savePosition(time){try{if(time>10)localStorage.setItem(POSITION_KEY,String(Math.floor(time)));else localStorage.removeItem(POSITION_KEY)}catch{}}
function clearPosition(){try{localStorage.removeItem(POSITION_KEY)}catch{}}
function showSpinner(on){$('#spinner').hidden=!on}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function startSession(){
  return fetch('/api/playback/session',{method:'POST',credentials:'same-origin',cache:'no-store',
    headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({movieId})});
}
function setStatus(message,error=false){
  $('#status').textContent=message;
  $('#status').classList.toggle('error',error);
  $('#retryBtn').hidden=!error;
}
function watchPath(id){return '/watch/'+encodeURIComponent(id)}
function setActiveSource(index,resume){
  pendingResume=resume||(activeOptionIndex>=0?{time:video.currentTime||0,play:!video.paused}:null);
  const source=availableSources[index];
  if(!source)return;
  activeOptionIndex=index;
  const select=$('#sourceSelect');
  if(!select.hidden)select.value=String(index);
  video.pause();
  video.preload='metadata';
  // Media bytes are requested only by the browser's native media engine.
  // The same-origin Worker enforces the signed playback cookie and byte ranges.
  video.src='/api/watch/'+encodeURIComponent(movieId)+'/'+encodeURIComponent(source.source_index);
  $('#downloadNow').href='/api/download/'+encodeURIComponent(movieId)+'/'+encodeURIComponent(source.source_index);
  setStatus('');
  refreshNativeAudioTracks();
}
function getNativeAudioTracks(){
  try{
    const list=video.audioTracks;
    if(!list||!Number.isFinite(Number(list.length)))return null;
    return list;
  }catch{return null;}
}
function refreshNativeAudioTracks(){
  const list=getNativeAudioTracks();
  const control=$('#audioControl'),select=$('#audioSelect');
  select.replaceChildren();
  if(!list||list.length<2){
    control.hidden=true;
    audioTrackList=list;
    return;
  }
  audioTrackList=list;
  for(let index=0;index<list.length;index++){
    const track=list[index];
    const lang=String(track.language||'').trim();
    const label=String(track.label||'').trim();
    const name=label||(lang?lang.toUpperCase():'Audio '+(index+1));
    select.add(new Option(name,String(index),Boolean(track.enabled),Boolean(track.enabled)));
  }
  const active=Array.from({length:list.length},(_,index)=>list[index]).findIndex(track=>track.enabled);
  if(active>=0)select.value=String(active);
  control.hidden=select.options.length<2;
}
function bindNativeAudioTrackEvents(){
  const list=getNativeAudioTracks();
  if(!list||list===audioTrackList)return;
  audioTrackList=list;
  for(const eventName of ['addtrack','removetrack','change']){
    try{list.addEventListener(eventName,refreshNativeAudioTracks);}catch{}
  }
  refreshNativeAudioTracks();
}
function selectNativeAudioTrack(value){
  const list=getNativeAudioTracks();
  const selected=Number(value);
  if(!list||!Number.isInteger(selected)||selected<0||selected>=list.length)return;
  try{
    for(let index=0;index<list.length;index++)list[index].enabled=index===selected;
    refreshNativeAudioTracks();
  }catch{
    setStatus('This browser cannot switch audio tracks for this video.',true);
  }
}
function renderSeriesPage(content){
  $('#playerShell').hidden=true;
  $('#sourceBar').hidden=true;
  $('#episodeContext').hidden=true;
  $('#episodeNavigation').hidden=true;
  $('#seriesBrowser').hidden=false;
  $('#title').textContent=content.title||'Web series';
  $('#category').textContent=(content.category||'')+' · Web Series';
  $('#seriesDescription').textContent=content.description||'Choose a season and episode to start watching.';
  if(content.poster_url){$('#seriesPoster').src=content.poster_url;$('#seriesPoster').hidden=false;}
  else $('#seriesPoster').hidden=true;
  const seasons=Array.isArray(content.seasons)?content.seasons:[];
  const select=$('#seasonSelect'),previous=select.value;
  select.replaceChildren();
  const episodeList=$('#episodeList');episodeList.replaceChildren();
  if(!seasons.length){episodeList.textContent='No published episodes are available yet.';select.disabled=true;return;}
  seasons.forEach(season=>select.add(new Option('Season '+season.season_number,String(season.season_number))));
  select.value=seasons.some(item=>String(item.season_number)===previous)?previous:String(seasons[0].season_number);
  const renderEpisodes=()=>{
    const season=seasons.find(item=>String(item.season_number)===select.value);
    episodeList.replaceChildren();
    const episodes=Array.isArray(season?.episodes)?season.episodes:[];
    if(!episodes.length){episodeList.textContent='No published episodes in this season.';return;}
    episodes.forEach(item=>{
      const link=document.createElement('a');link.className='episode-link';link.href=watchPath(item.id);
      const title=document.createElement('strong');title.textContent='Episode '+item.episode_number+' — '+item.title;
      const summary=document.createElement('small');summary.textContent=item.description||('Season '+season.season_number+' · Episode '+item.episode_number);
      link.append(title,summary);episodeList.append(link);
    });
  };
  select.addEventListener('change',renderEpisodes);
  renderEpisodes();
}
function renderEpisodeContext(content){
  if(content.content_type!=='episode'||!content.series_id)return;
  $('#episodeContext').hidden=false;
  $('#seriesBack').href=watchPath(content.series_id);
  $('#seriesBack').textContent='← '+(content.series_title||'Back to series');
  $('#episodeLabel').textContent='Season '+content.season_number+' · Episode '+content.episode_number;
  const prev=$('#previousEpisode'),next=$('#nextEpisode');
  prev.hidden=!content.previous_episode;next.hidden=!content.next_episode;
  if(content.previous_episode){prev.href=watchPath(content.previous_episode.id);prev.textContent='← '+content.previous_episode.title;}
  if(content.next_episode){next.href=watchPath(content.next_episode.id);next.textContent=content.next_episode.title+' →';}
  $('#episodeNavigation').hidden=!content.previous_episode&&!content.next_episode;
}
async function prepare(){
  try{
    const sessionRequest=startSession(); sessionRequest.catch(()=>{});
    const response=await fetch('/api/content/'+encodeURIComponent(movieId),{cache:'no-store',headers:{Accept:'application/json'},credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok||!data.content)throw new Error(data.error||'Could not load this content.');
    const content=data.content;
    if(content.content_type==='series'){renderSeriesPage(content);return;}
    $('#seriesBrowser').hidden=true;
    $('#playerShell').hidden=false;
    $('#title').textContent=content.title||'Untitled video';
    $('#category').textContent=(content.category||'')+(content.content_type==='episode'?' · Web Series':'');
    if(content.poster_url)video.poster=content.poster_url;
    renderEpisodeContext(content);
    availableSources=Array.isArray(content.video_sources)?content.video_sources:[];
    if(!availableSources.length)throw new Error('No Google Drive or Archive.org source is configured for this video.');
    const session=await sessionRequest;
    if(!session.ok){
      let message='Could not establish a secure playback session.';
      try{const payload=await session.json();if(payload.error)message=payload.error}catch{}
      throw new Error(message);
    }
    const select=$('#sourceSelect'),selectLabel=$('#sourceSelectLabel');
    select.replaceChildren();
    availableSources.forEach((source,index)=>{
      select.add(new Option((source.label||'Source '+(index+1))+' · '+(source.provider==='archive.org'?'Archive.org':'Google Drive'),String(index)));
    });
    select.hidden=availableSources.length<2;
    selectLabel.hidden=availableSources.length<2;
    $('#sourceBar').hidden=false;
    $('#downloadNow').hidden=false;
    if(availableSources.length>1){
      select.hidden=false;selectLabel.hidden=false;
    }
    recoveries=0;automaticFallbackUsed=false;
    const resumeAt=savedPosition();
    setActiveSource(0,resumeAt>10?{time:resumeAt,play:false,fromSaved:true}:null);
  }catch(error){
    setStatus(error.message||'This content is temporarily unavailable. Please try again.',true);
    $('#downloadNow').hidden=true;
  }
}
video.addEventListener('loadedmetadata',bindNativeAudioTrackEvents);
video.addEventListener('loadeddata',refreshNativeAudioTracks);
video.addEventListener('loadedmetadata',()=>{
  if(!pendingResume)return;
  const {time,play,fromSaved}=pendingResume;pendingResume=null;
  try{if(time>1&&(!Number.isFinite(video.duration)||time<video.duration-5))video.currentTime=time}catch{}
  if(fromSaved)setStatus('Resumed from '+fmtTime(time)+' - press play to continue.');
  if(play)video.play().catch(()=>{});
});
video.addEventListener('error',async()=>{
  showSpinner(false);
  const code=video.error?.code;
  const resumeTime=video.currentTime||pendingResume?.time||0;
  if((code===2||code===4)&&recoveries<2&&activeOptionIndex>=0){
    recoveries++;setStatus('Connection interrupted - reconnecting...');
    try{const session=await startSession();if(!session.ok)throw new Error('Session refresh failed')}catch{
      setStatus('Could not renew playback. Press Retry.',true);return;
    }
    setActiveSource(activeOptionIndex,{time:resumeTime,play:true});
    return;
  }
  if((code===2||code===4)&&availableSources.length>1&&!automaticFallbackUsed&&activeOptionIndex>=0){
    automaticFallbackUsed=true;
    recoveries=0;
    const next=(activeOptionIndex+1)%availableSources.length;
    setStatus('Current source failed - trying the next source...');
    try{const session=await startSession();if(!session.ok)throw new Error('Session refresh failed')}
    catch{setStatus('Could not renew playback. Press Retry.',true);return;}
    setActiveSource(next,{time:resumeTime,play:true});
    return;
  }
  const message=code===2?'The video connection was interrupted. Check your internet and press Retry.':
    code===3?'This browser could not decode the video format.':
    code===4?'This video could not be loaded (unsupported format or source unavailable). Try another source or press Retry.':
    'We could not play this video. Please try again.';
  setStatus(message,true);
});
video.addEventListener('waiting',()=>{showSpinner(true);setStatus('Buffering...')});
video.addEventListener('playing',()=>{showSpinner(false);setStatus('');recoveries=0});
video.addEventListener('canplay',()=>{showSpinner(false);if(!$('#status').classList.contains('error'))setStatus('')});
video.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSaved>5000&&!video.paused){lastSaved=now;savePosition(video.currentTime)}});
video.addEventListener('pause',()=>{if(!video.ended)savePosition(video.currentTime)});
video.addEventListener('ended',()=>{clearPosition();showSpinner(false)});
$('#retryBtn').addEventListener('click',async()=>{
  recoveries=0;setStatus('Reconnecting...');
  try{const session=await startSession();if(!session.ok)throw new Error('Session refresh failed')}
  catch{setStatus('Could not renew playback. Check your connection and retry.',true);return;}
  if(activeOptionIndex>=0)setActiveSource(activeOptionIndex,{time:video.currentTime||pendingResume?.time||0,play:true});
});
document.addEventListener('keydown',event=>{
  if(event.ctrlKey||event.metaKey||event.altKey)return;
  const tag=(event.target&&event.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='BUTTON'||!video.currentSrc)return;
  const key=event.key.toLowerCase();
  if(key==='arrowright')video.currentTime=Math.min(video.duration||Infinity,video.currentTime+10);
  else if(key==='arrowleft')video.currentTime=Math.max(0,video.currentTime-10);
  else if(key==='f'){document.fullscreenElement?document.exitFullscreen():video.requestFullscreen?.()}
  else if(key==='m')video.muted=!video.muted;
  else if(key===' '||key==='k'){video.paused?video.play().catch(()=>{}):video.pause()}
  else return;
  event.preventDefault();
});
$('#sourceSelect').addEventListener('change',event=>{recoveries=0;automaticFallbackUsed=false;setActiveSource(Number(event.target.value));});
$('#audioSelect').addEventListener('change',event=>selectNativeAudioTrack(event.target.value));
prepare();
</script>
<link rel="stylesheet" href="/pwa-install.css">
<script src="/pwa-install.js" defer></script>
</body>
</html>
