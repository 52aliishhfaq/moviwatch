<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moviwatch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/moviwatch-app-icon.svg">
<link rel="apple-touch-icon" href="/assets/moviwatch-app-icon-180.png">
<link rel="preconnect" href="https://drive.usercontent.google.com">
<link rel="preconnect" href="https://archive.org">
<title>Watch · Moviwatch</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#26334a;--muted:#9eabc4;--accent:#7185ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1a2944 0,transparent 55%),var(--bg);color:#f4f6fc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:68px;padding:0 max(5vw,22px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#080d18e8}
.brand{font-weight:750;font-size:19px;color:#fff;text-decoration:none;letter-spacing:-.3px}
header nav a,.back{color:#bdc8ff;text-decoration:none}
header nav a:hover,.back:hover{color:#fff}
main{width:min(1160px,calc(100% - 40px));margin:30px auto 64px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;font-size:14px}
.heading{margin-bottom:16px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0;letter-spacing:-.7px}
.meta{color:var(--muted);margin:8px 0 0;font-size:14px}
.player-shell{position:relative;overflow:hidden;padding:12px;background:#0b1220;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #0006}
movi-player{display:block;width:100%;aspect-ratio:16/9;min-height:0;height:auto;border-radius:10px;overflow:hidden;background:#05080e;--movi-accent:var(--accent);--movi-background:#05080e;--movi-panel:#111a2b;--movi-text:#f4f6fc}
movi-player::part(error-screen){display:none!important}
/* The player handles its own quiet loading state; no duplicate "Loading video" label. */
.status{min-height:24px;margin:12px 4px 2px;color:var(--muted);font-size:13px}
.status.error{color:#ff9d9d}
.status:empty{display:none}
.source-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 10px;padding:14px 16px;background:#111a2b;border:1px solid var(--line);border-radius:12px}
.source-bar [hidden]{display:none!important}
.source-bar label{font-weight:700;font-size:13px}
select{min-width:min(300px,100%);max-width:100%;height:42px;padding:0 38px 0 12px;background:#0d1627;color:#f4f6fc;border:1px solid #40506d;border-radius:9px;font:inherit}
.download-now{display:inline-flex;min-height:42px;align-items:center;justify-content:center;padding:9px 16px;border:1px solid #8294ff;border-radius:9px;background:#6578f5;color:#fff;text-decoration:none;font-weight:700}
.download-now[hidden]{display:none}
.retry{display:none;margin:8px 4px 2px;border:1px solid #53658a;border-radius:8px;background:#1b2941;color:#fff;padding:9px 14px;font:inherit;cursor:pointer}
.retry.show{display:inline-flex}
.series-browser,.episode-context,.episode-navigation{margin:16px 0;padding:16px;background:#111a2b;border:1px solid var(--line);border-radius:12px}
.series-poster{display:block;width:100%;max-height:280px;object-fit:cover;object-position:center 28%;border-radius:9px;margin:0 0 14px}
.series-browser h2{margin:0 0 6px;font-size:20px}
.series-description{margin:0 0 14px;color:var(--muted);font-size:14px}
.episode-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin-top:14px}
.episode-link{display:block;padding:12px;border:1px solid #35425c;border-radius:9px;background:#0d1627;color:#f4f6fc;text-decoration:none}
.episode-link:hover{border-color:#8494ff;background:#17233a}
.episode-link small{display:block;margin-top:3px;color:var(--muted)}
.episode-context{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.episode-context a,.episode-navigation a{color:#bdc8ff;text-decoration:none;font-weight:700}
.episode-navigation{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.episode-navigation a[aria-disabled="true"]{opacity:.35;pointer-events:none}
@media(max-width:650px){.series-browser,.episode-context,.episode-navigation{padding:12px}.episode-list{grid-template-columns:1fr}}
@media(max-width:650px){header{height:58px;padding:0 14px}main{width:calc(100% - 24px);margin:20px auto 40px}.player-shell{padding:0;border-radius:12px}.source-bar{align-items:stretch;flex-direction:column}.source-bar select,.source-bar .download-now{width:100%}}
</style>
</head>
<body>
<header><a class="brand" href="/">🎬 Moviwatch</a><nav><a href="/admin">Admin</a></nav></header>
<main>
<a class="back" href="/">← Back to catalogue</a>
<div class="heading"><h1 id="title">Loading movie…</h1><p class="meta" id="category"></p></div>
<div id="episodeContext" class="episode-context" hidden>
  <a id="seriesBack" href="/">← Back to series</a>
  <strong id="episodeLabel"></strong>
</div>
<section id="playerShell" class="player-shell" aria-label="Video player">
  <movi-player id="video" controls playsinline preload="metadata" buffersize="32" sw="auto" persist="volume speed audiolang" persistkey="moviwatch"></movi-player>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <button id="retry" class="retry" type="button">Retry stream</button>
</section>
<div id="sourceBar" class="source-bar">
  <a id="downloadNow" class="download-now" href="#" hidden>Download Now</a>
  <label id="sourceSelectLabel" for="sourceSelect" hidden>Streaming source</label>
  <select id="sourceSelect" aria-label="Choose video source" disabled hidden></select>
</div>
<nav id="episodeNavigation" class="episode-navigation" aria-label="Episode navigation" hidden>
  <a id="previousEpisode" href="#" hidden>← Previous episode</a>
  <a id="nextEpisode" href="#" hidden>Next episode →</a>
</nav>
<section id="seriesBrowser" class="series-browser" hidden>
  <img id="seriesPoster" class="series-poster" alt="">
  <h2>Seasons and episodes</h2>
  <p id="seriesDescription" class="series-description"></p>
  <label for="seasonSelect">Choose season</label>
  <select id="seasonSelect"></select>
  <div id="episodeList" class="episode-list"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/movi-player@0.4.1/dist/element.global.js"></script>
<script src="/player-range-source.js"></script>
<script>
const $=selector=>document.querySelector(selector);
const PLAYER_BUFFER_SIZE_MB=32;
const PLAYER_RANGE_CHUNK_SIZE=1024*1024;
const PLAYER_PREFETCH_AHEAD=2;
const movieId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('id')||'');
const video=$('#video');
let availableSources=[],activeOptionIndex=-1,startupTimer=null,generation=0,startupReady=false,activeRangeSource=null;

function setStatus(message,error=false){
  $('#status').textContent=message;
  $('#status').classList.toggle('error',error);
}
function setLoading(){/* Intentionally no external loading label: the player UI remains clean. */}
function clearTimer(){if(startupTimer!==null){clearTimeout(startupTimer);startupTimer=null;}}
function showError(){if(activeRangeSource)activeRangeSource.setPlaybackActive(false);clearTimer();setLoading(false);setStatus('We could not start this video. Please try again.',true);$('#retry').classList.add('show');}
function markPlayerReady(){
  startupReady=true;
  clearTimer();
  setLoading(false);
  setStatus('');
  $('#retry').classList.remove('show');
}
function playerState(event){
  const detail=event.detail;
  if(typeof detail==='string')return detail.toLowerCase();
  if(detail&&typeof detail.state==='string')return detail.state.toLowerCase();
  if(detail&&typeof detail.status==='string')return detail.status.toLowerCase();
  return '';
}

function updateDownload(index){
  const source=availableSources[index];
  const link=$('#downloadNow');
  link.textContent='Download Now';
  link.hidden=!source;
  link.removeAttribute('download');
  link.removeAttribute('target');
  link.removeAttribute('rel');
  link.removeAttribute('referrerpolicy');
  if(!source){link.removeAttribute('href');return;}
  // All providers now use the same protected Worker attachment route.
  // Raw Archive.org and Google Drive URLs never enter the public page.
  link.href='/api/download/'+encodeURIComponent(movieId)+'/'+source.source_index;
}

function playSource(localIndex){
  const source=availableSources[localIndex];
  if(!source)return;
  activeOptionIndex=localIndex;
  $('#sourceSelect').value=String(localIndex);
  updateDownload(localIndex);
  clearTimer();
  const current=++generation;
  startupReady=false;
  setLoading(true);
  setStatus('');
  $('#retry').classList.remove('show');
  video.preload='metadata';
  video.setAttribute('buffersize',String(PLAYER_BUFFER_SIZE_MB));
  const streamUrl='/api/watch/'+encodeURIComponent(movieId)+'/'+source.source_index;
  if(activeRangeSource){activeRangeSource.close();activeRangeSource=null;}
  if('sourceAdapter' in video && typeof window.MoviwatchRangeSource==='function'){
    activeRangeSource=new window.MoviwatchRangeSource(streamUrl,{
      chunkSize:PLAYER_RANGE_CHUNK_SIZE,
      maxCacheBytes:PLAYER_BUFFER_SIZE_MB*1024*1024,
      prefetchAhead:PLAYER_PREFETCH_AHEAD
    });
    video.sourceAdapter=activeRangeSource;
  }else{
    // Defensive compatibility fallback for an unexpected player build.
    video.src=streamUrl;
    setStatus('');
  }
  startupTimer=setTimeout(()=>{
    if(current===generation&&!startupReady){
      showError();
    }
  },30000);
}

function watchPath(id){return '/watch/'+encodeURIComponent(id)}
function renderSeriesPage(content){
  $('#playerShell').hidden=true;
  $('#sourceBar').hidden=true;
  $('#episodeContext').hidden=true;
  $('#episodeNavigation').hidden=true;
  $('#seriesBrowser').hidden=false;
  $('#title').textContent=content.title||'Web series';
  $('#category').textContent=(content.category||'')+' · Web Series';
  $('#seriesDescription').textContent=content.description||'Choose a season and episode to start watching.';
  if(content.poster_url){$('#seriesPoster').src=content.poster_url;$('#seriesPoster').hidden=false;}
  else $('#seriesPoster').hidden=true;
  const seasons=Array.isArray(content.seasons)?content.seasons:[];
  const select=$('#seasonSelect');select.replaceChildren();
  const episodeList=$('#episodeList');episodeList.replaceChildren();
  if(!seasons.length){episodeList.textContent='No published episodes are available yet.';select.disabled=true;return;}
  seasons.forEach(season=>select.add(new Option('Season '+season.season_number, String(season.season_number))));
  select.value=String(seasons[0].season_number);
  const renderEpisodes=()=>{
    const season=seasons.find(item=>String(item.season_number)===select.value);
    episodeList.replaceChildren();
    const episodes=Array.isArray(season?.episodes)?season.episodes:[];
    if(!episodes.length){episodeList.textContent='No published episodes in this season.';return;}
    episodes.forEach(item=>{
      const link=document.createElement('a');link.className='episode-link';link.href=watchPath(item.id);
      const title=document.createElement('strong');
      title.textContent='Episode '+item.episode_number+' — '+item.title;
      const summary=document.createElement('small');
      summary.textContent=item.description||('Season '+season.season_number+' · Episode '+item.episode_number);
      link.append(title,summary);episodeList.append(link);
    });
  };
  select.addEventListener('change',renderEpisodes);
  renderEpisodes();
}
function renderEpisodeContext(content){
  if(content.content_type!=='episode'||!content.series_id)return;
  $('#episodeContext').hidden=false;
  $('#seriesBack').href=watchPath(content.series_id);
  $('#seriesBack').textContent='← '+(content.series_title||'Back to series');
  $('#episodeLabel').textContent='Season '+content.season_number+' · Episode '+content.episode_number;
  const prev=$('#previousEpisode'),next=$('#nextEpisode');
  prev.hidden=!content.previous_episode;
  next.hidden=!content.next_episode;
  if(content.previous_episode){
    prev.href=watchPath(content.previous_episode.id);
    prev.textContent='← '+content.previous_episode.title;
  }
  if(content.next_episode){
    next.href=watchPath(content.next_episode.id);
    next.textContent=content.next_episode.title+' →';
  }
  $('#episodeNavigation').hidden=!content.previous_episode&&!content.next_episode;
}
async function prepare(){
  setLoading(true);
  setStatus('');
  try{
    const response=await fetch('/api/content/'+encodeURIComponent(movieId),{cache:'no-store',headers:{Accept:'application/json'},credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok||!data.content)throw new Error(data.error||'Could not load this content.');
    const content=data.content;
    if(content.content_type==='series'){
      renderSeriesPage(content);
      return;
    }
    $('#seriesBrowser').hidden=true;
    $('#playerShell').hidden=false;
    $('#sourceBar').hidden=false;
    $('#title').textContent=content.title||'Untitled video';
    $('#category').textContent=(content.category||'')+(content.content_type==='episode'?' · Web Series':'');
    if(content.poster_url)video.poster=content.poster_url;
    renderEpisodeContext(content);
    availableSources=Array.isArray(content.video_sources)?content.video_sources:[];
    if(!availableSources.length)throw new Error('No Google Drive or Archive.org source is configured for this episode.');

    const session=await fetch('/api/playback/session',{
      method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({movieId})
    });
    if(!session.ok){
      let message='Could not establish a secure playback session.';
      try{const payload=await session.json();if(payload.error)message=payload.error}catch{}
      throw new Error(message);
    }
    const select=$('#sourceSelect');
    const selectLabel=$('#sourceSelectLabel');
    select.hidden=availableSources.length<2;
    selectLabel.hidden=availableSources.length<2;
    select.replaceChildren();
    availableSources.forEach((source,index)=>{
      const option=document.createElement('option');
      option.value=String(index);
      option.textContent=(source.label||source.provider)+' · '+(source.provider==='archive.org'?'Archive.org':'Google Drive');
      select.append(option);
    });
    select.disabled=availableSources.length<2;
    playSource(0);
  }catch(error){
    setLoading(false);
    setStatus(error.message||'This content is temporarily unavailable. Please try again.',true);
    $('#retry').classList.add('show');
  }
}

video.addEventListener('play',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(true);});
video.addEventListener('pause',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(false);});
video.addEventListener('ended',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(false);});
video.addEventListener('loadeddata',markPlayerReady);
video.addEventListener('statechange',event=>{
  const state=playerState(event);
  if(state==='ready')markPlayerReady();
  else if(state==='playing'){
    if(activeRangeSource)activeRangeSource.setPlaybackActive(true);
    startupReady=true;
    clearTimer();
    setLoading(false);
    setStatus('');
    $('#retry').classList.remove('show');
  }else if(state==='paused'){
    if(activeRangeSource)activeRangeSource.setPlaybackActive(false);
  }else if(state==='buffering'&&!video.paused){
    setStatus('');
  }else if(state==='error'){
    showError('The player could not decode or fetch this media. Check the source and codec.');
  }
});
video.addEventListener('error',event=>{
  // Do not leak low-level decoder/network internals into the customer UI.
  // sw="auto" already attempted the built-in software fallback before this event.
  showError();
});
$('#sourceSelect').addEventListener('change',event=>playSource(Number(event.target.value)));
$('#retry').addEventListener('click',()=>playSource(Math.max(activeOptionIndex,0)));
prepare();
</script>
<link rel="stylesheet" href="/pwa-install.css">
<script src="/pwa-install.js" defer></script>
</body>
</html>
