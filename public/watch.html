<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>Watch movie · Moviwatch</title>

<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#26334a;--muted:#9eabc4;--accent:#7185ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1a2944 0,transparent 55%),var(--bg);color:#f4f6fc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:68px;padding:0 max(5vw,22px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#080d18e8}
.brand{font-weight:750;font-size:19px;color:#fff;text-decoration:none;letter-spacing:-.3px}
header nav a,.back{color:#bdc8ff;text-decoration:none}
header nav a:hover,.back:hover{color:#fff}
main{width:min(1160px,calc(100% - 40px));margin:30px auto 64px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;font-size:14px}
.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0;letter-spacing:-.7px}
.meta{color:var(--muted);margin:8px 0 0;font-size:14px}
.player-shell{padding:12px;background:#0b1220;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #0006}
.player-shell movi-player{display:block;width:100%;aspect-ratio:16/9;min-height:220px;border-radius:10px;overflow:hidden;background:#05080e;--movi-accent:var(--accent);--movi-background:#05080e;--movi-panel:#111a2b;--movi-text:#f4f6fc}
.status{min-height:24px;margin:12px 4px 2px;color:var(--muted);font-size:13px}
.status.error{color:#ff9d9d}
.status:empty{display:none}
.loading{display:flex;align-items:center;gap:10px;color:#c7d1e5;padding:26px 4px}.loading[hidden]{display:none!important}
.spinner{width:16px;height:16px;border:2px solid #52617c;border-top-color:#aabaff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry{display:none;margin:8px 4px 2px;border:1px solid #53658a;border-radius:8px;background:#1b2941;color:#fff;padding:9px 14px;font:inherit;cursor:pointer}
.retry.show{display:inline-flex}
.downloads{margin:18px 0 28px;padding:18px;background:linear-gradient(145deg,#111a2b,#0d1524);border:1px solid var(--line);border-radius:14px}
.downloads h2{font-size:17px;margin:0 0 5px}.download-note{color:var(--muted);font-size:13px;margin:0 0 13px}
.download-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.download-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #3a4a6a;border-radius:10px;background:#182640;color:#f5f7ff;text-decoration:none;font-weight:650;transition:background .15s,border-color .15s}
.download-link:hover,.download-link:focus-visible{background:#263a60;border-color:#8294ff;outline:none}
.download-link small{display:block;color:#b9c6e1;font-size:11px;font-weight:450}
.download-link .download-icon{font-size:19px}
@media(max-width:650px){.downloads{padding:14px}.download-list{grid-template-columns:1fr}}
@media(max-width:650px){header{height:58px}main{width:calc(100% - 24px);margin:20px auto 40px}.player-shell{padding:6px;border-radius:12px}.heading{display:block}h1{font-size:25px}}
</style>
</head>
<body>
<header><a class="brand" href="/">🎬 Moviwatch</a><nav><a href="/admin">Admin</a></nav></header>
<main>
<a class="back" href="/">← Back to catalogue</a>
<div class="heading"><div><h1 id="title">Loading movie…</h1><p class="meta" id="category"></p></div></div>
<section class="player-shell" aria-label="Movie player">
  <movi-player id="video" controls playsinline preload="none" persist="volume speed audiolang" persistkey="moviwatch"></movi-player>
  <div id="loading" class="loading"><span class="spinner"></span><span>Checking video stream…</span></div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <button id="retry" class="retry" type="button">Retry stream</button>
</section>
<section id="downloads" class="downloads" aria-labelledby="downloadHeading" hidden>
  <h2 id="downloadHeading">Download this video</h2>
  <p class="download-note">Choose the available quality or video option. Each download is separate.</p>
  <div id="downloadList" class="download-list"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/movi-player@0.4.1/dist/element.global.js"></script>
<script>
const $=s=>document.querySelector(s);
const movieId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('id')||'');
const video=$('#video');
let streamUrl='',mediaContainer='unknown',mediaType='';
function status(message,error=false){$('#status').textContent=message;$('#status').classList.toggle('error',error)}
function loading(on){$('#loading').hidden=!on}
function mediaError(){
  const e=video.error;
  let message='Video playback failed.';
  if(e?.code===4){
    if(['mkv','avi','flv','ogg','ebml'].includes(mediaContainer)){
      message='This file is '+mediaContainer.toUpperCase()+'. Chrome/Edge cannot play this container directly. It needs MP4 (H.264 video + AAC audio) or HLS conversion.';
    }else if(mediaContainer==='mp4'){
      message='The file is an MP4, but its video/audio codec may not be browser-compatible (for example HEVC, AC3 or DTS). Re-encode to H.264 + AAC MP4 or HLS.';
    }else{
      message='The browser rejected this media source. Detected container: '+mediaContainer+'. The file may be malformed or use an unsupported codec.';
    }
  }else if(e?.code===2) message='Network error while downloading the video stream.';
  else if(e?.code===3) message='The browser could not decode this video. The codec may be unsupported or the file may be damaged.';
  else if(e?.code===1) message='Playback was interrupted.';
  status(message,true);$('#retry').classList.add('show');loading(false);
}
async function prepare(){
  $('#retry').classList.remove('show');loading(true);status('');
  try{
    const catalog=await fetch('/api/movies',{cache:'no-store'});
    const data=await catalog.json();
    if(!catalog.ok)throw new Error(data.error||'Could not load the movie catalogue.');
    const movie=(data.movies||[]).find(x=>x.id===movieId);
    if(!movie)throw new Error('This movie is not published or could not be found.');
    $('#title').textContent=movie.title;
    $('#category').textContent=movie.category||'';
    if(movie.poster_url)video.poster=movie.poster_url;
    streamUrl='/api/watch/'+encodeURIComponent(movieId)+'/0';
    if(!Array.isArray(movie.video_sources)||!movie.video_sources.length)throw new Error('No video source is configured for this movie.');
    const downloadList=$('#downloadList');
    downloadList.replaceChildren();
    movie.video_sources.forEach((source,index)=>{
      const link=document.createElement('a');
      link.className='download-link';
      link.href='/api/download/'+encodeURIComponent(movieId)+'/'+index;
      link.setAttribute('download','');
      link.dataset.downloadIndex=String(index);
      const text=document.createElement('span');
      const name=document.createElement('span');
      name.textContent=source.label||('Video '+(index+1));
      const hint=document.createElement('small');
      hint.textContent='Download video file';
      text.append(name,hint);
      const icon=document.createElement('span');
      icon.className='download-icon';
      icon.textContent='↓';
      icon.setAttribute('aria-hidden','true');
      link.append(text,icon);
      downloadList.append(link);
    });
    $('#downloads').hidden=false;
    // Fetch metadata using HEAD; this reports the exact total size without
    // downloading the file. The first 1-byte range is cached for the GET.
    await Promise.all(movie.video_sources.map(async(source,index)=>{
      try{
        const response=await fetch('/api/download/'+encodeURIComponent(movieId)+'/'+index,{
          method:'HEAD',cache:'no-store'
        });
        const link=downloadList.querySelector('[data-download-index="'+index+'"]');
        if(!link)return;
        if(!response.ok){
          const hint=link.querySelector('small');
          if(hint)hint.textContent='Download details unavailable';
          return;
        }
        const bytes=Number(response.headers.get('x-moviwatch-file-size')||response.headers.get('content-length'));
        const size=Number.isFinite(bytes)&&bytes>0
          ? (bytes/1073741824>=1?(bytes/1073741824).toFixed(2)+' GB':(bytes/1048576).toFixed(1)+' MB')
          : 'Size unavailable';
        const hint=link.querySelector('small');
        if(hint)hint.textContent='Download now · '+size;
        const filename=response.headers.get('content-disposition')||'';
        if(filename)link.title=filename;
      }catch{
        const link=downloadList.querySelector('[data-download-index="'+index+'"]');
        const hint=link?.querySelector('small');
        if(hint)hint.textContent='Download now';
      }
    }));
    status('Checking video source…');
    const probe=await fetch(streamUrl,{headers:{Range:'bytes=0-1'},cache:'no-store'});
    if(!probe.ok){
      let detail='Video server returned HTTP '+probe.status+'.';
      try{const body=await probe.json();if(body.error)detail=body.error}catch{}
      throw new Error(detail);
    }
    if(probe.status!==206)throw new Error('Video server did not return a valid byte-range response (HTTP '+probe.status+').');
    mediaContainer=probe.headers.get('x-moviwatch-container')||'unknown';
    mediaType=probe.headers.get('content-type')||'unknown';
    const type=mediaType.toLowerCase();
    if(type.includes('text/html')||type.includes('application/json'))throw new Error('Google Drive returned a web page instead of a video. Set sharing to “Anyone with the link”.');
    await probe.arrayBuffer();
    video.src=streamUrl;
    video.load();
    loading(false);
    status('Stream ready · '+mediaContainer.toUpperCase()+' · '+mediaType+' · Press play');
  }catch(e){
    loading(false);status(e.message||'Unable to prepare this video.',true);$('#retry').classList.add('show');
  }
}
video.addEventListener('error',mediaError);
video.addEventListener('loadedmetadata',()=>{loading(false);status('')});
$('#retry').addEventListener('click',prepare);
prepare();
</script>
</body>
</html>
