<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moviwatch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/moviwatch-app-icon.svg">
<link rel="apple-touch-icon" href="/assets/moviwatch-app-icon-180.png">
<link rel="preconnect" href="https://drive.usercontent.google.com">
<link rel="preconnect" href="https://archive.org">
<title>Watch · Moviwatch</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#26334a;--muted:#9eabc4;--accent:#7185ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1a2944 0,transparent 55%),var(--bg);color:#f4f6fc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:68px;padding:0 max(5vw,22px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#080d18e8}
.brand{font-weight:750;font-size:19px;color:#fff;text-decoration:none;letter-spacing:-.3px}
header nav a,.back{color:#bdc8ff;text-decoration:none}
header nav a:hover,.back:hover{color:#fff}
main{width:min(1160px,calc(100% - 40px));margin:30px auto 64px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;font-size:14px}
.heading{margin-bottom:16px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0;letter-spacing:-.7px}
.meta{color:var(--muted);margin:8px 0 0;font-size:14px}
.player-shell{position:relative;overflow:hidden;padding:10px;background:#05080e;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 60px #0005}
.video-stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:9px;overflow:hidden}
movi-player{display:block;width:100%;height:100%;min-height:0;aspect-ratio:16/9;background:#000;--movi-accent:var(--accent);--movi-background:#05080e;--movi-panel:#111a2b;--movi-text:#f4f6fc}
movi-player::part(error-screen){display:none!important}
.big-play{position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%;border:0;background:linear-gradient(transparent,#0005);color:#fff;cursor:pointer}
.big-play span{display:grid;place-items:center;width:76px;height:76px;border:1px solid #ffffff80;border-radius:50%;background:#111a2bdc;font-size:28px;box-shadow:0 8px 36px #0009;backdrop-filter:blur(8px)}
.big-play:hover span{background:#6478f4}
.big-play[hidden]{display:none}
.status{min-height:0;margin:8px 4px 0;color:var(--muted);font-size:12px}
.status.error{color:#ff9d9d}
.status:empty{display:none}
.player-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:4px 2px}
.control-button{display:inline-grid;place-items:center;flex:0 0 auto;width:38px;height:36px;border:1px solid #35425c;border-radius:8px;background:#111a2b;color:#f4f6fc;font:inherit;font-size:16px;cursor:pointer}
.control-button:hover{background:#1c2a43;border-color:#6578f5}
.control-button:disabled{opacity:.45;cursor:not-allowed}
.time-label{flex:0 0 auto;min-width:82px;color:#d9e0f1;font-size:12px;font-variant-numeric:tabular-nums;text-align:center}
.progress-control{flex:1 1 140px;min-width:80px;accent-color:#788aff;cursor:pointer}
.volume-control{display:flex;align-items:center;gap:6px}
.volume-control input{width:76px;accent-color:#788aff}
.audio-control{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.audio-control[hidden]{display:none}
.audio-control select,.source-bar select{min-width:110px;max-width:210px;height:36px;padding:0 28px 0 9px;background:#0d1627;color:#f4f6fc;border:1px solid #40506d;border-radius:8px;font:inherit;font-size:12px}
.source-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 10px}
.source-bar [hidden]{display:none!important}
.source-bar label{font-weight:700;font-size:12px;color:var(--muted)}
.retry{display:none;margin:8px 4px 2px;border:1px solid #53658a;border-radius:8px;background:#1b2941;color:#fff;padding:9px 14px;font:inherit;cursor:pointer}
.retry.show{display:inline-flex}
.series-browser,.episode-context,.episode-navigation{margin:16px 0;padding:16px;background:#111a2b;border:1px solid var(--line);border-radius:12px}
.series-poster{display:block;width:100%;max-height:280px;object-fit:cover;object-position:center 28%;border-radius:9px;margin:0 0 14px}
.series-browser h2{margin:0 0 6px;font-size:20px}
.series-description{margin:0 0 14px;color:var(--muted);font-size:14px}
.episode-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin-top:14px}
.episode-link{display:block;padding:12px;border:1px solid #35425c;border-radius:9px;background:#0d1627;color:#f4f6fc;text-decoration:none}
.episode-link:hover{border-color:#8494ff;background:#17233a}
.episode-link small{display:block;margin-top:3px;color:var(--muted)}
.episode-context{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.episode-context a,.episode-navigation a{color:#bdc8ff;text-decoration:none;font-weight:700}
.episode-navigation{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.episode-navigation a[aria-disabled="true"]{opacity:.35;pointer-events:none}
@media(max-width:650px){.series-browser,.episode-context,.episode-navigation{padding:12px}.episode-list{grid-template-columns:1fr}}
@media(max-width:650px){header{height:58px;padding:0 14px}main{width:calc(100% - 24px);margin:20px auto 40px}.player-shell{padding:0;border-radius:12px}.source-bar{align-items:stretch;flex-direction:column}.source-bar select,.source-bar .download-now{width:100%}}
</style>
</head>
<body>
<header><a class="brand" href="/">🎬 Moviwatch</a><nav><a href="/admin">Admin</a></nav></header>
<main>
<a class="back" href="/">← Back to catalogue</a>
<div class="heading"><h1 id="title">Loading movie…</h1><p class="meta" id="category"></p></div>
<div id="episodeContext" class="episode-context" hidden>
  <a id="seriesBack" href="/">← Back to series</a>
  <strong id="episodeLabel"></strong>
</div>
<section id="playerShell" class="player-shell" aria-label="Video player">
  <div class="video-stage">
    <movi-player id="video" playsinline preload="none" buffersize="12" sw="auto" objectfit="contain" nohotkeys persist="volume audiolang" persistkey="moviwatch"></movi-player>
    <button id="bigPlay" class="big-play" type="button" aria-label="Play movie" disabled><span>▶</span></button>
  </div>
  <div class="player-controls" aria-label="Playback controls">
    <button id="playPause" class="control-button" type="button" aria-label="Play" disabled>▶</button>
    <span id="currentTime" class="time-label">0:00</span>
    <input id="progress" class="progress-control" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
    <span id="duration" class="time-label">0:00</span>
    <label class="volume-control" aria-label="Volume"><span aria-hidden="true">🔊</span><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" disabled></label>
    <label id="audioControl" class="audio-control" hidden><span>Audio</span><select id="audioSelect" aria-label="Audio language"></select></label>
    <button id="fullscreen" class="control-button" type="button" aria-label="Fullscreen" disabled>⛶</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <button id="retry" class="retry" type="button">Retry stream</button>
</section>
<div id="sourceBar" class="source-bar" hidden>
  <label id="sourceSelectLabel" for="sourceSelect">Source</label>
  <select id="sourceSelect" aria-label="Choose video source" disabled></select>
</div>
<nav id="episodeNavigation" class="episode-navigation" aria-label="Episode navigation" hidden>
  <a id="previousEpisode" href="#" hidden>← Previous episode</a>
  <a id="nextEpisode" href="#" hidden>Next episode →</a>
</nav>
<section id="seriesBrowser" class="series-browser" hidden>
  <img id="seriesPoster" class="series-poster" alt="">
  <h2>Seasons and episodes</h2>
  <p id="seriesDescription" class="series-description"></p>
  <label for="seasonSelect">Choose season</label>
  <select id="seasonSelect"></select>
  <div id="episodeList" class="episode-list"></div>
</section>
</main>
<script id="moviPlayerLibrary" defer src="https://cdn.jsdelivr.net/npm/movi-player@0.4.1/dist/element.slim.global.js" crossorigin="anonymous"></script>
<script id="moviRangeLibrary" defer src="/player-range-source.js"></script>
<script>
const $=selector=>document.querySelector(selector);
const PLAYER_BUFFER_SIZE_MB=12;
const PLAYER_RANGE_CHUNK_SIZE=1024*1024;
const PLAYER_PREFETCH_AHEAD=1;
const movieId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('id')||'');
const video=$('#video');
let availableSources=[],activeOptionIndex=-1,startupTimer=null,generation=0,startupReady=false,activeRangeSource=null;
let playerLibrariesReady=false,playerLibraryError=false,currentAudioTracks=[];

function setStatus(message,error=false){
  $('#status').textContent=message;
  $('#status').classList.toggle('error',error);
}
function clearTimer(){if(startupTimer!==null){clearTimeout(startupTimer);startupTimer=null;}}
function showError(){
  if(activeRangeSource)activeRangeSource.setPlaybackActive(false);
  clearTimer();
  $('#bigPlay').hidden=false;
  $('#bigPlay').disabled=false;
  $('#playPause').textContent='▶';
  $('#playPause').setAttribute('aria-label','Retry playback');
  setStatus('We could not start this video. Please try again.',true);
  $('#retry').classList.add('show');
}
function formatTime(value){
  if(!Number.isFinite(value)||value<0)return '0:00';
  const total=Math.floor(value),hours=Math.floor(total/3600),minutes=Math.floor((total%3600)/60),seconds=total%60;
  return hours?hours+':'+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0'):minutes+':'+String(seconds).padStart(2,'0');
}
function updateTime(){
  const duration=Number(video.duration)||0,current=Number(video.currentTime)||0;
  $('#currentTime').textContent=formatTime(current);
  $('#duration').textContent=formatTime(duration);
  $('#progress').disabled=!duration;
  if(duration&&!seekingProgress)$('#progress').value=String(Math.round(Math.min(1,current/duration)*1000));
}
let seekingProgress=false;
function updatePlayControls(){
  const playing=!video.paused&&!video.ended;
  $('#playPause').textContent=playing?'Ⅱ':'▶';
  $('#playPause').setAttribute('aria-label',playing?'Pause':'Play');
  $('#bigPlay').hidden=playing;
}
function markPlayerReady(){
  startupReady=true;
  clearTimer();
  setStatus('');
  $('#retry').classList.remove('show');
  updatePlayControls();
  updateTime();
  refreshAudioTracks();
}
function refreshAudioTracks(){
  let tracks=[];
  try{
    // The custom element intentionally exposes language-keyed track helpers.
    // Numeric track IDs belong to its internal MoviPlayer instance.
    if(typeof video.getAudioLangs==='function')tracks=video.getAudioLangs()||[];
  }catch{}
  currentAudioTracks=Array.isArray(tracks)?tracks.filter(track=>track&&typeof track==='object'):[];
  const control=$('#audioControl'),select=$('#audioSelect');
  select.replaceChildren();
  if(currentAudioTracks.length<2){
    control.hidden=true;
    return;
  }
  currentAudioTracks.forEach((track,index)=>{
    const lang=String(track.lang||'').trim();
    const label=String(track.label||'').trim()||lang.toUpperCase()||('Audio '+(index+1));
    // Language codes are the stable selection key exposed by <movi-player>.
    if(!lang)return;
    const option=new Option(label,lang,Boolean(track.active),Boolean(track.active));
    select.add(option);
  });
  if(select.options.length<2){
    control.hidden=true;
    return;
  }
  const active=currentAudioTracks.find(track=>track.active&&track.lang);
  if(active)select.value=String(active.lang);
  control.hidden=false;
}
async function selectAudioTrack(language){
  const lang=String(language||'');
  if(!lang||typeof video.selectAudioLang!=='function'){
    setStatus('Audio switching is not available for this file.',true);
    return;
  }
  try{
    const switched=await video.selectAudioLang(lang);
    if(!switched)setStatus('This audio track could not be selected on this source.',true);
    else setStatus('');
    refreshAudioTracks();
  }catch{
    setStatus('This audio track could not be selected on this source.',true);
  }
}
function playSource(localIndex,playAfterLoad=true){
  const source=availableSources[localIndex];
  if(!source||!playerLibrariesReady||!window.MoviwatchRangeSource)return;
    activeOptionIndex=localIndex;
  $('#sourceSelect').value=String(localIndex);
  clearTimer();
  const current=++generation;
  startupReady=false;
  setStatus('Loading movie…');
  $('#retry').classList.remove('show');
  $('#audioControl').hidden=true;
  currentAudioTracks=[];
  if(activeRangeSource){
    try{video.pause();}catch{}
    activeRangeSource.close();
    activeRangeSource=null;
  }
  video.preload='none';
  video.setAttribute('buffersize',String(PLAYER_BUFFER_SIZE_MB));
  const streamUrl='/api/watch/'+encodeURIComponent(movieId)+'/'+source.source_index;
  activeRangeSource=new window.MoviwatchRangeSource(streamUrl,{
    chunkSize:PLAYER_RANGE_CHUNK_SIZE,
    maxCacheBytes:PLAYER_BUFFER_SIZE_MB*1024*1024,
    prefetchAhead:PLAYER_PREFETCH_AHEAD
  });
  // The protected Worker URL remains the only media source seen by the player.
  video.sourceAdapter=activeRangeSource;
  $('#bigPlay').hidden=true;
  if(playAfterLoad){
    const playPromise=video.play();
    if(playPromise&&typeof playPromise.catch==='function')playPromise.catch(()=>{});
  }else{
    $('#bigPlay').hidden=false;
    setStatus('');
  }
  startupTimer=setTimeout(()=>{
    if(current===generation&&!startupReady)showError();
  },30000);
}
function startPlayback(){
  if(!playerLibrariesReady||playerLibraryError)return;
  if(!activeRangeSource)playSource(Math.max(activeOptionIndex,0),true);
  else{
    const result=video.play();
    if(result&&typeof result.catch==='function')result.catch(()=>showError());
  }
}
function watchPath(id){return '/watch/'+encodeURIComponent(id)}
function renderSeriesPage(content){
  $('#playerShell').hidden=true;
  $('#sourceBar').hidden=true;
  $('#episodeContext').hidden=true;
  $('#episodeNavigation').hidden=true;
  $('#seriesBrowser').hidden=false;
  $('#title').textContent=content.title||'Web series';
  $('#category').textContent=(content.category||'')+' · Web Series';
  $('#seriesDescription').textContent=content.description||'Choose a season and episode to start watching.';
  if(content.poster_url){$('#seriesPoster').src=content.poster_url;$('#seriesPoster').hidden=false;}
  else $('#seriesPoster').hidden=true;
  const seasons=Array.isArray(content.seasons)?content.seasons:[];
  const select=$('#seasonSelect'),previous=select.value;
  select.replaceChildren();
  const episodeList=$('#episodeList');episodeList.replaceChildren();
  if(!seasons.length){episodeList.textContent='No published episodes are available yet.';select.disabled=true;return;}
  seasons.forEach(season=>select.add(new Option('Season '+season.season_number,String(season.season_number))));
  select.value=seasons.some(item=>String(item.season_number)===previous)?previous:String(seasons[0].season_number);
  const renderEpisodes=()=>{
    const season=seasons.find(item=>String(item.season_number)===select.value);
    episodeList.replaceChildren();
    const episodes=Array.isArray(season?.episodes)?season.episodes:[];
    if(!episodes.length){episodeList.textContent='No published episodes in this season.';return;}
    episodes.forEach(item=>{
      const link=document.createElement('a');link.className='episode-link';link.href=watchPath(item.id);
      const title=document.createElement('strong');title.textContent='Episode '+item.episode_number+' — '+item.title;
      const summary=document.createElement('small');summary.textContent=item.description||('Season '+season.season_number+' · Episode '+item.episode_number);
      link.append(title,summary);episodeList.append(link);
    });
  };
  select.addEventListener('change',renderEpisodes);
  renderEpisodes();
}
function renderEpisodeContext(content){
  if(content.content_type!=='episode'||!content.series_id)return;
  $('#episodeContext').hidden=false;
  $('#seriesBack').href=watchPath(content.series_id);
  $('#seriesBack').textContent='← '+(content.series_title||'Back to series');
  $('#episodeLabel').textContent='Season '+content.season_number+' · Episode '+content.episode_number;
  const prev=$('#previousEpisode'),next=$('#nextEpisode');
  prev.hidden=!content.previous_episode;next.hidden=!content.next_episode;
  if(content.previous_episode){prev.href=watchPath(content.previous_episode.id);prev.textContent='← '+content.previous_episode.title;}
  if(content.next_episode){next.href=watchPath(content.next_episode.id);next.textContent=content.next_episode.title+' →';}
  $('#episodeNavigation').hidden=!content.previous_episode&&!content.next_episode;
}
function setPlayerLibraryState(){
  const scripts=['#moviPlayerLibrary','#moviRangeLibrary'];
  const loaded=scripts.every(selector=>$(selector)?.dataset.loaded==='true');
  const failed=scripts.some(selector=>$(selector)?.dataset.failed==='true');
  if(failed){
    playerLibraryError=true;
    setStatus('The lightweight player could not load. Please refresh and try again.',true);
    $('#bigPlay').disabled=true;$('#playPause').disabled=true;
    return;
  }
  playerLibrariesReady=loaded;
  $('#bigPlay').disabled=!loaded;
  $('#playPause').disabled=!loaded;
  if(loaded)setStatus('');
}
function watchLibraryEvent(event){
  event.currentTarget.dataset.loaded='true';
  setPlayerLibraryState();
}
function watchLibraryError(event){
  event.currentTarget.dataset.failed='true';
  setPlayerLibraryState();
}
['#moviPlayerLibrary','#moviRangeLibrary'].forEach(selector=>{
  const script=$(selector);
  script.addEventListener('load',watchLibraryEvent,{once:true});
  script.addEventListener('error',watchLibraryError,{once:true});
  if(selector==='#moviPlayerLibrary'&&customElements.get('movi-player'))script.dataset.loaded='true';
  if(selector==='#moviRangeLibrary'&&window.MoviwatchRangeSource)script.dataset.loaded='true';
});
setPlayerLibraryState();
$('#bigPlay').addEventListener('click',startPlayback);
$('#playPause').addEventListener('click',()=>{
  if(!activeRangeSource){startPlayback();return;}
  if(video.paused||video.ended)startPlayback();else video.pause();
});
$('#progress').addEventListener('input',()=>{
  seekingProgress=true;
  const duration=Number(video.duration)||0;
  $('#currentTime').textContent=formatTime(duration*(Number($('#progress').value)/1000));
});
$('#progress').addEventListener('change',()=>{
  const duration=Number(video.duration)||0;
  if(duration)video.currentTime=duration*(Number($('#progress').value)/1000);
  seekingProgress=false;
  updateTime();
});
$('#volume').addEventListener('input',()=>{video.volume=Number($('#volume').value);});
$('#audioSelect').addEventListener('change',event=>selectAudioTrack(event.target.value));
$('#fullscreen').addEventListener('click',async()=>{
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await $('#playerShell').requestFullscreen();
  }catch{}
});
$('#sourceSelect').addEventListener('change',event=>playSource(Number(event.target.value),true));
$('#retry').addEventListener('click',()=>playSource(Math.max(activeOptionIndex,0),true));
video.addEventListener('play',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(true);updatePlayControls();});
video.addEventListener('pause',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(false);updatePlayControls();});
video.addEventListener('ended',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(false);updatePlayControls();});
video.addEventListener('loadeddata',markPlayerReady);
video.addEventListener('loadedmetadata',()=>{markPlayerReady();updateTime();});
video.addEventListener('durationchange',updateTime);
video.addEventListener('timeupdate',updateTime);
video.addEventListener('trackschange',event=>refreshAudioTracks(event));
video.addEventListener('audioTrackChange',()=>refreshAudioTracks());
video.addEventListener('audiotrackchange',()=>refreshAudioTracks());
video.addEventListener('statechange',event=>{
  const detail=event.detail,state=typeof detail==='string'?detail.toLowerCase():
    (typeof detail?.state==='string'?detail.state.toLowerCase():(typeof detail?.status==='string'?detail.status.toLowerCase():''));
  if(state==='ready'||state==='playing')markPlayerReady();
  else if(state==='paused')updatePlayControls();
  else if(state==='buffering'&&!video.paused)setStatus('Buffering…');
  else if(state==='error')showError();
});
video.addEventListener('error',showError);
video.addEventListener('contextmenu',event=>event.preventDefault());
$('#volume').value='1';
async function prepare(){
  try{
    const response=await fetch('/api/content/'+encodeURIComponent(movieId),{cache:'no-store',headers:{Accept:'application/json'},credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok||!data.content)throw new Error(data.error||'Could not load this content.');
    const content=data.content;
    if(content.content_type==='series'){renderSeriesPage(content);return;}
    $('#seriesBrowser').hidden=true;
    $('#playerShell').hidden=false;
    $('#title').textContent=content.title||'Untitled video';
    $('#category').textContent=(content.category||'')+(content.content_type==='episode'?' · Web Series':'');
    if(content.poster_url)video.poster=content.poster_url;
    renderEpisodeContext(content);
    availableSources=Array.isArray(content.video_sources)?content.video_sources:[];
    if(!availableSources.length)throw new Error('No Google Drive or Archive.org source is configured for this episode.');
    const session=await fetch('/api/playback/session',{
      method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({movieId})
    });
    if(!session.ok){
      let message='Could not establish a secure playback session.';
      try{const payload=await session.json();if(payload.error)message=payload.error}catch{}
      throw new Error(message);
    }
    const select=$('#sourceSelect'),selectLabel=$('#sourceSelectLabel');
    select.replaceChildren();
    availableSources.forEach((source,index)=>select.add(new Option(
      (source.label||'Source '+(index+1))+' · '+(source.provider==='archive.org'?'Archive.org':'Google Drive'),
      String(index)
    )));
    select.hidden=availableSources.length<2;
    selectLabel.hidden=availableSources.length<2;
    select.disabled=availableSources.length<2;
    activeOptionIndex=0;
    setStatus('Ready to watch');
    $('#bigPlay').disabled=!playerLibrariesReady;
    $('#playPause').disabled=!playerLibrariesReady;
  }catch(error){
    setStatus(error.message||'This content is temporarily unavailable. Please try again.',true);
    $('#bigPlay').hidden=true;
    $('#retry').classList.add('show');
  }
}
prepare();
</script>
<script src="/player-range-source.js"></script>
<script>
const $=selector=>document.querySelector(selector);
const PLAYER_BUFFER_SIZE_MB=32;
const PLAYER_RANGE_CHUNK_SIZE=1024*1024;
const PLAYER_PREFETCH_AHEAD=2;
const movieId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('id')||'');
const video=$('#video');
let availableSources=[],activeOptionIndex=-1,startupTimer=null,generation=0,startupReady=false,activeRangeSource=null;

function setStatus(message,error=false){
  $('#status').textContent=message;
  $('#status').classList.toggle('error',error);
}
function setLoading(){/* Intentionally no external loading label: the player UI remains clean. */}
function clearTimer(){if(startupTimer!==null){clearTimeout(startupTimer);startupTimer=null;}}
function showError(){if(activeRangeSource)activeRangeSource.setPlaybackActive(false);clearTimer();setLoading(false);setStatus('We could not start this video. Please try again.',true);$('#retry').classList.add('show');}
function markPlayerReady(){
  startupReady=true;
  clearTimer();
  setLoading(false);
  setStatus('');
  $('#retry').classList.remove('show');
}
function playerState(event){
  const detail=event.detail;
  if(typeof detail==='string')return detail.toLowerCase();
  if(detail&&typeof detail.state==='string')return detail.state.toLowerCase();
  if(detail&&typeof detail.status==='string')return detail.status.toLowerCase();
  return '';
}

function updateDownload(index){
  const source=availableSources[index];
  const link=$('#downloadNow');
  link.textContent='Download Now';
  link.hidden=!source;
  link.removeAttribute('download');
  link.removeAttribute('target');
  link.removeAttribute('rel');
  link.removeAttribute('referrerpolicy');
  if(!source){link.removeAttribute('href');return;}
  // All providers now use the same protected Worker attachment route.
  // Raw Archive.org and Google Drive URLs never enter the public page.
  link.href='/api/download/'+encodeURIComponent(movieId)+'/'+source.source_index;
}

function playSource(localIndex){
  const source=availableSources[localIndex];
  if(!source)return;
  activeOptionIndex=localIndex;
  $('#sourceSelect').value=String(localIndex);
  updateDownload(localIndex);
  clearTimer();
  const current=++generation;
  startupReady=false;
  setLoading(true);
  setStatus('');
  $('#retry').classList.remove('show');
  video.preload='metadata';
  video.setAttribute('buffersize',String(PLAYER_BUFFER_SIZE_MB));
  const streamUrl='/api/watch/'+encodeURIComponent(movieId)+'/'+source.source_index;
  if(activeRangeSource){activeRangeSource.close();activeRangeSource=null;}
  if('sourceAdapter' in video && typeof window.MoviwatchRangeSource==='function'){
    activeRangeSource=new window.MoviwatchRangeSource(streamUrl,{
      chunkSize:PLAYER_RANGE_CHUNK_SIZE,
      maxCacheBytes:PLAYER_BUFFER_SIZE_MB*1024*1024,
      prefetchAhead:PLAYER_PREFETCH_AHEAD
    });
    video.sourceAdapter=activeRangeSource;
  }else{
    // Defensive compatibility fallback for an unexpected player build.
    video.src=streamUrl;
    setStatus('');
  }
  startupTimer=setTimeout(()=>{
    if(current===generation&&!startupReady){
      showError();
    }
  },30000);
}

function watchPath(id){return '/watch/'+encodeURIComponent(id)}
function renderSeriesPage(content){
  $('#playerShell').hidden=true;
  $('#sourceBar').hidden=true;
  $('#episodeContext').hidden=true;
  $('#episodeNavigation').hidden=true;
  $('#seriesBrowser').hidden=false;
  $('#title').textContent=content.title||'Web series';
  $('#category').textContent=(content.category||'')+' · Web Series';
  $('#seriesDescription').textContent=content.description||'Choose a season and episode to start watching.';
  if(content.poster_url){$('#seriesPoster').src=content.poster_url;$('#seriesPoster').hidden=false;}
  else $('#seriesPoster').hidden=true;
  const seasons=Array.isArray(content.seasons)?content.seasons:[];
  const select=$('#seasonSelect');select.replaceChildren();
  const episodeList=$('#episodeList');episodeList.replaceChildren();
  if(!seasons.length){episodeList.textContent='No published episodes are available yet.';select.disabled=true;return;}
  seasons.forEach(season=>select.add(new Option('Season '+season.season_number, String(season.season_number))));
  select.value=String(seasons[0].season_number);
  const renderEpisodes=()=>{
    const season=seasons.find(item=>String(item.season_number)===select.value);
    episodeList.replaceChildren();
    const episodes=Array.isArray(season?.episodes)?season.episodes:[];
    if(!episodes.length){episodeList.textContent='No published episodes in this season.';return;}
    episodes.forEach(item=>{
      const link=document.createElement('a');link.className='episode-link';link.href=watchPath(item.id);
      const title=document.createElement('strong');
      title.textContent='Episode '+item.episode_number+' — '+item.title;
      const summary=document.createElement('small');
      summary.textContent=item.description||('Season '+season.season_number+' · Episode '+item.episode_number);
      link.append(title,summary);episodeList.append(link);
    });
  };
  select.addEventListener('change',renderEpisodes);
  renderEpisodes();
}
function renderEpisodeContext(content){
  if(content.content_type!=='episode'||!content.series_id)return;
  $('#episodeContext').hidden=false;
  $('#seriesBack').href=watchPath(content.series_id);
  $('#seriesBack').textContent='← '+(content.series_title||'Back to series');
  $('#episodeLabel').textContent='Season '+content.season_number+' · Episode '+content.episode_number;
  const prev=$('#previousEpisode'),next=$('#nextEpisode');
  prev.hidden=!content.previous_episode;
  next.hidden=!content.next_episode;
  if(content.previous_episode){
    prev.href=watchPath(content.previous_episode.id);
    prev.textContent='← '+content.previous_episode.title;
  }
  if(content.next_episode){
    next.href=watchPath(content.next_episode.id);
    next.textContent=content.next_episode.title+' →';
  }
  $('#episodeNavigation').hidden=!content.previous_episode&&!content.next_episode;
}
async function prepare(){
  setLoading(true);
  setStatus('');
  try{
    const response=await fetch('/api/content/'+encodeURIComponent(movieId),{cache:'no-store',headers:{Accept:'application/json'},credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok||!data.content)throw new Error(data.error||'Could not load this content.');
    const content=data.content;
    if(content.content_type==='series'){
      renderSeriesPage(content);
      return;
    }
    $('#seriesBrowser').hidden=true;
    $('#playerShell').hidden=false;
    $('#sourceBar').hidden=false;
    $('#title').textContent=content.title||'Untitled video';
    $('#category').textContent=(content.category||'')+(content.content_type==='episode'?' · Web Series':'');
    if(content.poster_url)video.poster=content.poster_url;
    renderEpisodeContext(content);
    availableSources=Array.isArray(content.video_sources)?content.video_sources:[];
    if(!availableSources.length)throw new Error('No Google Drive or Archive.org source is configured for this episode.');

    const session=await fetch('/api/playback/session',{
      method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({movieId})
    });
    if(!session.ok){
      let message='Could not establish a secure playback session.';
      try{const payload=await session.json();if(payload.error)message=payload.error}catch{}
      throw new Error(message);
    }
    const select=$('#sourceSelect');
    const selectLabel=$('#sourceSelectLabel');
    select.hidden=availableSources.length<2;
    selectLabel.hidden=availableSources.length<2;
    select.replaceChildren();
    availableSources.forEach((source,index)=>{
      const option=document.createElement('option');
      option.value=String(index);
      option.textContent=(source.label||source.provider)+' · '+(source.provider==='archive.org'?'Archive.org':'Google Drive');
      select.append(option);
    });
    select.disabled=availableSources.length<2;
    playSource(0);
  }catch(error){
    setLoading(false);
    setStatus(error.message||'This content is temporarily unavailable. Please try again.',true);
    $('#retry').classList.add('show');
  }
}

video.addEventListener('play',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(true);});
video.addEventListener('pause',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(false);});
video.addEventListener('ended',()=>{if(activeRangeSource)activeRangeSource.setPlaybackActive(false);});
video.addEventListener('loadeddata',markPlayerReady);
video.addEventListener('statechange',event=>{
  const state=playerState(event);
  if(state==='ready')markPlayerReady();
  else if(state==='playing'){
    if(activeRangeSource)activeRangeSource.setPlaybackActive(true);
    startupReady=true;
    clearTimer();
    setLoading(false);
    setStatus('');
    $('#retry').classList.remove('show');
  }else if(state==='paused'){
    if(activeRangeSource)activeRangeSource.setPlaybackActive(false);
  }else if(state==='buffering'&&!video.paused){
    setStatus('');
  }else if(state==='error'){
    showError('The player could not decode or fetch this media. Check the source and codec.');
  }
});
video.addEventListener('error',event=>{
  // Do not leak low-level decoder/network internals into the customer UI.
  // sw="auto" already attempted the built-in software fallback before this event.
  showError();
});
$('#sourceSelect').addEventListener('change',event=>playSource(Number(event.target.value)));
$('#retry').addEventListener('click',()=>playSource(Math.max(activeOptionIndex,0)));
prepare();
</script>
